name: Validate research workflow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression and bundled-data tests
        run: python -m pytest -q
      - name: Generate reports
        run: python -m clean_air_os --output outputs/ci
      - name: Execute maintained notebook
        run: python scripts/check_notebook.py
